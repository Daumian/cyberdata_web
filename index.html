<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Enlaces - Cyberdata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --drive-color: #22c55e;
            --trello-color: #0284c7;
            --instagram-color: #e1306c;
            --linkedin-color: #0077b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 12px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-align: left;
            font-weight: 600;
        }

        .main-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 35px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-drive {
            background-color: var(--drive-color);
        }

        .btn-trello {
            background-color: var(--trello-color);
        }

        .social-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-social {
            padding: 14px 20px;
            font-size: 0.95rem;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .btn-linkedin {
            background-color: var(--linkedin-color);
        }

        .btn i {
            font-size: 1.25rem;
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <i class="fa-solid fa-cubes logo-icon"></i>
            <h1>Cyberdata</h1>
            <p class="subtitle">Central de Enlaces y Herramientas</p>
        </div>

        <div class="section-title">Principales</div>
        <div class="main-links">
            <a href="https://drive.google.com/drive/folders/1fOPMxbZZlD9f_NA4dWxS1PL_UZr9UmuC" target="_blank" class="btn btn-drive">
                <i class="fa-brands fa-google-drive"></i> Drive Cyberdata
            </a>
            <a href="https://trello.com/invite/b/68b391f9b0042cc14d472e76/ATTI7eda2af44722caef7b5895df4bc3e58883530E4F/general" target="_blank" class="btn btn-trello">
                <i class="fa-brands fa-trello"></i> Tareas Pendientes
            </a>
        </div>

        <div class="section-title">Redes Sociales</div>
        <div class="social-links">
            <a href="https://www.instagram.com/cyberdata.soluciones/" target="_blank" class="btn btn-social btn-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="https://www.linkedin.com/company/107899451" target="_blank" class="btn btn-social btn-linkedin">
                <i class="fa-brands fa-linkedin"></i> LinkedIn
            </a>
        </div>

        <footer>
            &copy; 2026 Cyberdata Soluciones. Todos los derechos reservados.
        </footer>
    </div>

</body>
</html>
